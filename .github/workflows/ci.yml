name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: Detect Languages
    runs-on: ubuntu-latest
    outputs:
      has_rust: ${{ steps.detect.outputs.has_rust }}
      has_deny: ${{ steps.detect.outputs.has_deny }}
      has_python: ${{ steps.detect.outputs.has_python }}
      has_go: ${{ steps.detect.outputs.has_go }}
      has_typescript: ${{ steps.detect.outputs.has_typescript }}
      has_security: ${{ steps.detect.outputs.has_security }}
      has_trunk: ${{ steps.detect.outputs.has_trunk }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 1
          persist-credentials: false

      - id: detect
        run: |
          set +e
          # Initialize all outputs to false (critical: every output must be set)
          echo "has_rust=false" >> $GITHUB_OUTPUT
          echo "has_deny=false" >> $GITHUB_OUTPUT
          echo "has_python=false" >> $GITHUB_OUTPUT
          echo "has_go=false" >> $GITHUB_OUTPUT
          echo "has_typescript=false" >> $GITHUB_OUTPUT
          echo "has_security=false" >> $GITHUB_OUTPUT
          echo "has_trunk=false" >> $GITHUB_OUTPUT

          # Rust: needs Cargo.toml AND deny.toml
          if [ -f "Cargo.toml" ] || [ -f "**/Cargo.toml" ]; then
            echo "has_rust=true" >> $GITHUB_OUTPUT
            if [ -f "deny.toml" ]; then
              echo "has_deny=true" >> $GITHUB_OUTPUT
            fi
          fi

          # Python: needs pyproject.toml, setup.py, requirements.txt, or *.py
          if [ -f "pyproject.toml" ] || [ -f "setup.py" ] || [ -f "requirements.txt" ] || find . -maxdepth 3 -name "*.py" -type f 2>/dev/null | head -1 | grep -q .; then
            echo "has_python=true" >> $GITHUB_OUTPUT
          fi

          # Go: needs go.mod
          if [ -f "go.mod" ]; then
            echo "has_go=true" >> $GITHUB_OUTPUT
          fi

          # TypeScript / JS: needs package.json (with type=module or tsconfig or js files)
          if [ -f "package.json" ]; then
            echo "has_typescript=true" >> $GITHUB_OUTPUT
          fi

          # Security: always run (bandit/gitleaks/dependency-review)
          echo "has_security=true" >> $GITHUB_OUTPUT

          # Trunk: only if trunk.yaml exists
          if [ -f "trunk.yaml" ]; then
            echo "has_trunk=true" >> $GITHUB_OUTPUT
          fi

          echo ""
          echo "=== Detected ==="
          echo "rust=${{ steps.detect.outputs.has_rust }} deny=${{ steps.detect.outputs.has_deny }} python=${{ steps.detect.outputs.has_python }} go=${{ steps.detect.outputs.has_go }} typescript=${{ steps.detect.outputs.has_typescript }} security=${{ steps.detect.outputs.has_security }} trunk=${{ steps.detect.outputs.has_trunk }}"

  rust:
    name: Rust
    needs: detect
    if: needs.detect.outputs.has_rust == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-31
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: cargo fmt --check
        run: |
          cargo fmt --all -- --check 2>&1 || echo "::warning::cargo fmt issues (advisory)"
      - name: cargo clippy
        run: |
          cargo clippy --all-targets -- -D warnings 2>&1 || echo "::warning::clippy issues (advisory)"
      - name: cargo test
        run: |
          cargo test --workspace --no-fail-fast 2>&1 || echo "::warning::test failures (advisory)"

  cargo-deny:
    name: Cargo Deny (Advisories + Licenses)
    needs: detect
    if: needs.detect.outputs.has_deny == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable 2026-08-31
      - name: cargo-deny check
        uses: EmbarkStudios/cargo-deny-action@3f4a782664881cf5725d0ffd23969fcce89fd868 # v1.6.3
        with:
          arguments: --all-features

  python:
    name: Python
    needs: detect
    if: needs.detect.outputs.has_python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install test and lint tools
        run: python3 -m pip install pytest ruff
      - name: Ruff check dependency delta
        run: ruff check scripts/dependency_delta.py tests/test_ci_dependency_delta.py tests/test_public_audit_workflow.py tests/test_ci_action_pins.py
      - name: Ruff format dependency delta
        run: ruff format --check scripts/dependency_delta.py tests/test_ci_dependency_delta.py tests/test_public_audit_workflow.py tests/test_ci_action_pins.py
      - name: Run hostile dependency delta fixtures
        run: python3 -m pytest -q tests/test_ci_dependency_delta.py tests/test_public_audit_workflow.py tests/test_ci_action_pins.py

  go:
    name: Go
    needs: detect
    if: needs.detect.outputs.has_go == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version: "1.22"
      - name: gofmt check
        run: gofmt -l . 2>&1 || echo "::warning::gofmt issues (advisory)"
      - name: go vet
        run: go vet ./... 2>&1 || echo "::warning::go vet issues (advisory)"
      - name: go test
        run: go test ./... 2>&1 || echo "::warning::test failures (advisory)"

  typescript:
    name: TS/JS
    needs: detect
    if: needs.detect.outputs.has_typescript == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          # No `cache: 'npm'` -- this public mirror's root has package.json
          # but no package-lock.json (the real JS project is in
          # CivicSurvival/UI/ which has its own lockfile and is handled by
          # the civic-quality job below with cache-dependency-path). The
          # root `package.json` exists only to declare repo-level scripts
          # (lint, format, scorecard, release:*). Caching is therefore
          # disabled here; the job is advisory anyway (continue-on-error).
      - run: npm ci --no-audit --no-fund || npm install --no-audit --no-fund || true
      - name: lint
        run: |
          if [ -f package.json ] && grep -q '"lint"' package.json; then
            npm run lint 2>&1 || echo "::warning::lint issues (advisory)"
          fi
      - name: test
        run: |
          if [ -f package.json ] && grep -q '"test"' package.json; then
            npm test 2>&1 || echo "::warning::test failures (advisory)"
          fi

  security:
    name: Security Scan
    needs: detect
    if: needs.detect.outputs.has_security == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: gitleaks
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dep-review:
    name: Dependency Delta
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - name: Install dependency scanner
        run: python3 -m pip install pip-audit
      - name: Scan changed dependency manifests
        run: >
          python3 scripts/dependency_delta.py
          --base "${{ github.event.pull_request.base.sha }}"
          --head "${{ github.event.pull_request.head.sha }}"

  civic-quality:
    name: Civic Evidence Gate
    if: always()
    needs: [security, dep-review]
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed on prerequisites
        shell: bash
        env:
          SECURITY_RESULT: ${{ needs.security.result }}
          DEPENDENCY_RESULT: ${{ needs.dep-review.result }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          test "$SECURITY_RESULT" = success
          if [ "$EVENT_NAME" = pull_request ]; then test "$DEPENDENCY_RESULT" = success; fi
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.11"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: |
            CivicSurvival/UI/npm-shrinkwrap.json
            CivicSurvival/UI/package-lock.json
      - name: Run locked UI and Civic checks
        working-directory: CivicSurvival/UI
        run: |
          npm ci --ignore-scripts
          npm run check:contracts
          npm run typecheck:declarations
          npm run test:lint-rules
          npm run test:ui
          npm run lint:strict
          test -f bundle-baseline.json
          npm run bundle:check
      - name: Evaluate Civic repository evidence
        run: python scripts/civic_quality_gate.py . --policy .github/civic-quality-policy.json --output json --strict > civic-quality-report.json
      - name: Upload Civic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: civic-quality-evidence-${{ github.run_id }}
          path: civic-quality-report.json

  lint:
    name: ci / lint
    if: always()
    needs:
      [detect, rust, cargo-deny, python, go, typescript, security, dep-review]
    runs-on: ubuntu-latest
    steps:
      - name: Aggregate lint gate
        run: |
          failed=0
          event_name="${{ github.event_name }}"
          for pair in \
            "rust:${{ needs.rust.result }}" \
            "cargo-deny:${{ needs.cargo-deny.result }}" \
            "python:${{ needs.python.result }}" \
            "go:${{ needs.go.result }}" \
            "typescript:${{ needs.typescript.result }}" \
            "security:${{ needs.security.result }}" \
            "dep-review:${{ needs.dep-review.result }}" \
            ; do
            name="${pair%%:*}"
            result="${pair#*:}"
            required=0
            if [ "$name" = "security" ]; then
              required=1
            elif [ "$event_name" = "pull_request" ] && [ "$name" = "dep-review" ]; then
              required=1
            fi
            if [ "$required" -eq 1 ] && [ "$result" != "success" ]; then
              echo "  ✗ $name: $result"
              failed=$((failed + 1))
            elif [ "$result" = "failure" ] || [ "$result" = "cancelled" ]; then
              echo "  ✗ $name: $result"
              failed=$((failed + 1))
            elif [ "$result" = "success" ] || [ "$result" = "skipped" ]; then
              echo "  ✓ $name: $result"
            else
              echo "  ✗ $name: $result"
              failed=$((failed + 1))
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo ""
            echo "❌ $failed lint check(s) failed"
            exit 1
          fi
          echo ""
          echo "✅ All lint checks passed (or were skipped)"

  test:
    name: ci / test
    if: always()
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - name: Test gate
        run: |
          lint_result="${{ needs.lint.result }}"
          if [ "$lint_result" != "success" ]; then
            echo "❌ ci / lint did not pass: $lint_result"
            exit 1
          fi
          echo "✅ ci / lint passed"

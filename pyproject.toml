# CivicSurvival Public -- pyproject.toml
#
# Canonical Python project metadata for the test suite, scorecard, and
# release tooling. Mirrors the existing CircleCI config (uv run pytest
# --cov --durations=5) so contributors and CI agree on the dev workflow.

[project]
name = "civic-survival-public-tooling"
version = "0.3.25"
description = "CI/QA tooling for the CivicSurvival public source mirror"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Koosha Pari", email = "kooshapari@gmail.com" },
]

# Pure metadata -- not installed; the runtime is the C# Unity mod.
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-benchmark>=4.0",
    "hypothesis>=6.100",
    "PyYAML>=6.0",
    "ruff>=0.6",
]
fuzz = [
    "hypothesis>=6.100",
]
bench = [
    "pytest-benchmark>=4.0",
]

[project.urls]
Homepage = "https://github.com/KooshaPari/CivicSurvival-public"
Issues = "https://github.com/KooshaPari/CivicSurvival-public/issues"

[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = []

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests", "benches"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
markers = [
    "integration: end-to-end suite checks (requires tmp git repo)",
    "fuzz: property-based fuzz tests (uses Hypothesis)",
    "bench: pytest-benchmark performance gates",
    "stress: soak / stress tests (long-running)",
    "e2e: end-to-end tests requiring the CS2 runtime (run in the closed CI)",
    "env_sensitive: requires external CLI not present on all hosts",
]
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["scripts", "tests"]
omit = [
    "*/__pycache__/*",
    "*/.pytest_cache/*",
    "tests/fixtures/*",
    "build-evidence/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
precision = 1
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "def __repr__",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
    "build-evidence",
    ".github",
    "*.lock.json",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.ruff.lint]
# Deliberately the same rule set as the CI runner. Do not add rules
# here without first running them in the CI ruff check.
select = ["E", "F", "W", "I", "B", "UP"]
ignore = [
    "B008",  # do not perform function calls in default arguments
    "E501",  # line length is enforced by formatter, not linter
]
